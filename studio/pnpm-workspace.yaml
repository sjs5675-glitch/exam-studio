# 빌드 스크립트 정책.
# pnpm 11 은 onlyBuiltDependencies 를 더 이상 읽지 않고 allowBuilds 를 사용한다
# (구버전 pnpm 9 호환을 위해 onlyBuiltDependencies 도 남겨 둔다).
# 이 프로젝트의 네이티브 의존성은 모두 prebuilt 바이너리로 동작하므로
# (@img/sharp-*, @esbuild/*, unrs-resolver napi 플랫폼 패키지) 빌드 스크립트가 필요 없다.
# 네 패키지의 결정을 명시해야 pnpm 이 "pending build" 로 보지 않아, 스크립트 실행 전
# 의존성 점검(runDepsStatusCheck)에서 ERR_PNPM_IGNORED_BUILDS(exit 1)로 기동이 막히지 않는다.
onlyBuiltDependencies:
  - esbuild
  - sharp
allowBuilds:
  esbuild: false
  msw: false
  sharp: false
  unrs-resolver: false
