# 앱 기동 시(start-*.bat/vbs → pnpm dev/dev:sse) pnpm 이 스크립트 실행 전 의존성을
# 재점검/재설치하지 않게 한다. 의존성은 install 단계에서 이미 설치되므로 불필요하고,
# pnpm 11 의 이 사전 점검(runDepsStatusCheck)이 ignored-builds 를 만나면 exit 1 로
# 기동을 막는다. false 로 끄면 dev 스크립트가 곧장 실행된다.
verifyDepsBeforeRun: false

# 빌드 스크립트 정책.
# pnpm 11 은 onlyBuiltDependencies 를 더 이상 읽지 않고 allowBuilds 를 사용한다
# (구버전 pnpm 9 호환을 위해 onlyBuiltDependencies 도 남겨 둔다).
# 이 프로젝트의 네이티브 의존성은 모두 prebuilt 바이너리로 동작하므로
# (@img/sharp-*, @esbuild/*, unrs-resolver napi 플랫폼 패키지) 빌드 스크립트가 필요 없다.
onlyBuiltDependencies:
  - esbuild
  - sharp
allowBuilds:
  esbuild: false
  msw: false
  sharp: false
  unrs-resolver: false
